<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Taxi Blue Rock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --negro:#0a0a0a; --negro-suave:#111; --gris-oscuro:#1a1a1a;
  --gris-medio:#2a2a2a; --gris-claro:#888; --blanco:#f0f0f0;
  --azul:#0066ff; --azul-neon:#00a8ff; --rojo:#e63946; --verde:#25D366;
  --fuente-titulo:'Bebas Neue',sans-serif; --fuente-cuerpo:'Inter',sans-serif;
  --trans:all .3s cubic-bezier(.25,.46,.45,.94);
}
body{font-family:var(--fuente-cuerpo);background:var(--negro);color:var(--blanco);min-height:100vh;line-height:1.6;}
a{color:inherit;text-decoration:none;}

/* LOGIN */
.login-screen{
  position:fixed;inset:0;background:radial-gradient(circle at 30% 30%,rgba(0,102,255,.15),transparent 55%),
  radial-gradient(circle at 70% 70%,rgba(230,57,70,.08),transparent 55%),var(--negro);
  display:flex;align-items:center;justify-content:center;padding:1rem;z-index:1000;
}
.login-screen.hidden{display:none;}
.login-card{
  background:var(--gris-oscuro);border:1px solid var(--gris-medio);border-radius:14px;
  padding:3rem 2.5rem;width:100%;max-width:400px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.login-card .logo{font-family:var(--fuente-titulo);font-size:2.5rem;letter-spacing:3px;margin-bottom:.3rem;}
.login-card .logo span{color:var(--azul);}
.login-card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:3px;color:var(--gris-claro);font-weight:600;margin-bottom:2.5rem;}
.login-card input{
  width:100%;padding:1rem;background:var(--negro);border:1px solid var(--gris-medio);
  border-radius:8px;color:var(--blanco);font-size:1.5rem;text-align:center;letter-spacing:8px;
  font-family:var(--fuente-cuerpo);outline:none;transition:var(--trans);
}
.login-card input:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,102,255,.2);}
.login-card button{
  width:100%;margin-top:1rem;padding:1rem;background:var(--azul);color:#fff;border:none;
  border-radius:8px;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;
  cursor:pointer;transition:var(--trans);font-family:var(--fuente-cuerpo);
}
.login-card button:hover{background:var(--azul-neon);box-shadow:0 0 25px rgba(0,102,255,.5);}
.login-error{color:var(--rojo);font-size:.85rem;margin-top:1rem;display:none;font-weight:600;}
.login-error.show{display:block;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* PANEL */
.panel{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 4rem;display:none;}
.panel.active{display:block;animation:fadeIn .5s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:1.5rem;margin-bottom:2rem;border-bottom:1px solid var(--gris-medio);
  flex-wrap:wrap;gap:1rem;
}
.topbar .logo{font-family:var(--fuente-titulo);font-size:1.8rem;letter-spacing:2px;}
.topbar .logo span{color:var(--azul);}
.topbar-actions{display:flex;gap:.6rem;flex-wrap:wrap;}

.btn{
  padding:.7rem 1.4rem;font-size:.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;border-radius:6px;cursor:pointer;border:1px solid transparent;
  font-family:var(--fuente-cuerpo);transition:var(--trans);display:inline-flex;
  align-items:center;gap:.5rem;
}
.btn-primary{background:var(--azul);color:#fff;}
.btn-primary:hover{background:var(--azul-neon);box-shadow:0 0 20px rgba(0,102,255,.5);}
.btn-outline{background:transparent;border-color:var(--gris-medio);color:var(--blanco);}
.btn-outline:hover{border-color:var(--azul);color:var(--azul-neon);}
.btn-danger{background:transparent;border-color:var(--rojo);color:var(--rojo);}
.btn-danger:hover{background:var(--rojo);color:#fff;}

.section-title{font-family:var(--fuente-titulo);font-size:2rem;letter-spacing:2px;margin-bottom:.3rem;}
.section-title span{color:var(--azul);}
.section-sub{color:var(--gris-claro);font-size:.85rem;margin-bottom:1.5rem;}

.admin-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:2rem;align-items:start;}

.card{
  background:var(--gris-oscuro);border:1px solid var(--gris-medio);border-radius:12px;padding:1.8rem;
}
.form-group{margin-bottom:1.2rem;}
.form-group label{
  display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gris-claro);margin-bottom:.5rem;
}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:.85rem 1rem;background:var(--negro);border:1px solid var(--gris-medio);
  border-radius:6px;color:var(--blanco);font-family:var(--fuente-cuerpo);font-size:.9rem;
  outline:none;transition:var(--trans);
}
.form-group input:focus,.form-group textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,102,255,.15);}
.form-group textarea{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}

.flyer-upload{
  border:2px dashed var(--gris-medio);border-radius:10px;padding:1.5rem;text-align:center;
  cursor:pointer;transition:var(--trans);position:relative;overflow:hidden;
}
.flyer-upload:hover{border-color:var(--azul);background:rgba(0,102,255,.05);}
.flyer-upload input{display:none;}
.flyer-upload .icon{font-size:2.2rem;margin-bottom:.5rem;opacity:.7;}
.flyer-upload .text{font-size:.8rem;color:var(--gris-claro);}
.flyer-upload .text strong{color:var(--azul-neon);}
.flyer-preview{position:relative;margin-top:1rem;display:none;}
.flyer-preview.show{display:block;}
.flyer-preview img{width:100%;border-radius:8px;border:1px solid var(--gris-medio);max-height:280px;object-fit:cover;}
.flyer-preview .remove{
  position:absolute;top:.5rem;right:.5rem;background:var(--rojo);color:#fff;border:none;
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;font-weight:700;
}

.events-list{display:flex;flex-direction:column;gap:.8rem;}
.event-item{
  background:var(--negro);border:1px solid var(--gris-medio);border-radius:10px;
  padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:center;
  gap:1rem;transition:var(--trans);
}
.event-item:hover{border-color:var(--azul);}
.event-item .info{flex:1;min-width:0;}
.event-item .date{
  font-family:var(--fuente-titulo);font-size:1.3rem;color:var(--azul);
  letter-spacing:1px;display:block;line-height:1.1;
}
.event-item .title{font-size:.95rem;font-weight:600;margin:.15rem 0;}
.event-item .place{font-size:.75rem;color:var(--gris-claro);text-transform:uppercase;letter-spacing:1px;}
.event-item .actions{display:flex;gap:.4rem;}
.event-item .actions button{
  width:34px;height:34px;border-radius:6px;background:var(--gris-oscuro);
  border:1px solid var(--gris-medio);color:var(--blanco);cursor:pointer;
  font-size:.9rem;transition:var(--trans);
}
.event-item .actions .edit:hover{border-color:var(--azul);color:var(--azul-neon);}
.event-item .actions .del:hover{border-color:var(--rojo);color:var(--rojo);}
.event-thumb{
  width:50px;height:50px;border-radius:6px;object-fit:cover;flex-shrink:0;
  border:1px solid var(--gris-medio);
}
.empty-state{
  text-align:center;padding:2rem 1rem;color:var(--gris-claro);font-size:.85rem;
  border:1px dashed var(--gris-medio);border-radius:10px;
}

.toast{
  position:fixed;bottom:2rem;right:2rem;background:var(--gris-oscuro);
  border:1px solid var(--azul);color:var(--blanco);padding:1rem 1.5rem;border-radius:8px;
  font-size:.85rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);
  transform:translateY(150%);transition:var(--trans);z-index:2000;
  display:flex;align-items:center;gap:.6rem;
}
.toast.show{transform:translateY(0);}
.toast.success{border-color:var(--verde);}
.toast.error{border-color:var(--rojo);}

@media (max-width:900px){
  .admin-grid{grid-template-columns:1fr;}
}
@media (max-width:600px){
  .panel{padding:1rem .8rem 3rem;}
  .topbar{flex-direction:column;align-items:flex-start;}
  .card{padding:1.3rem;}
  .form-row{grid-template-columns:1fr;}
  .event-item{flex-wrap:wrap;}
  .event-item .actions{width:100%;justify-content:flex-end;}
  .toast{left:1rem;right:1rem;bottom:1rem;}
  .section-title{font-size:1.6rem;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo">TAXI <span>BLUE</span></div>
    <h2>Panel de Administración</h2>
    <input type="password" id="passInput" placeholder="••••••" maxlength="10" inputmode="numeric" autocomplete="off">
    <button onclick="tryLogin()">Ingresar</button>
    <div class="login-error" id="loginError">Clave incorrecta. Intentá de nuevo.</div>
  </div>
</div>

<!-- PANEL -->
<div class="panel" id="panel">
  <div class="topbar">
    <div class="logo">TAXI <span>BLUE</span> · ADMIN</div>
    <div class="topbar-actions">
      <button class="btn btn-outline" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="admin-grid">
    <!-- FORM -->
    <div class="card">
      <h2 class="section-title" id="formTitle">NUEVO <span>EVENTO</span></h2>
      <p class="section-sub">Completá los datos y guardá. El flyer es opcional (JPG/PNG).</p>
      <form onsubmit="saveEvent(event)">
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label>Fecha *</label>
            <input type="date" id="fecha" required>
          </div>
          <div class="form-group">
            <label>Hora</label>
            <input type="text" id="hora" placeholder="Ej: 21:00 hs">
          </div>
        </div>
        <div class="form-group">
          <label>Título del evento *</label>
          <input type="text" id="titulo" placeholder="Ej: Taxi Blue en Vivo" required>
        </div>
        <div class="form-group">
          <label>Lugar / Venue *</label>
          <input type="text" id="lugar" placeholder="Ej: La Bodega · Villa María, Córdoba" required>
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="descripcion" placeholder="Breve descripción del show..."></textarea>
        </div>
        <div class="form-group">
          <label>Flyer del evento (JPG/PNG · opcional)</label>
          <div class="flyer-upload" onclick="document.getElementById('flyerInput').click()">
            <input type="file" id="flyerInput" accept="image/jpeg,image/jpg,image/png" onchange="handleFlyer(event)">
            <div class="icon">🖼️</div>
            <div class="text">Hacé click o arrastrá una imagen<br><strong>JPG / PNG</strong> · máx. 800 KB</div>
          </div>
          <div class="flyer-preview" id="flyerPreview">
            <img id="flyerImg" alt="Flyer">
            <button type="button" class="remove" onclick="removeFlyer()">✕</button>
          </div>
        </div>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary" style="flex:1;">💾 Guardar Evento</button>
          <button type="button" class="btn btn-outline" onclick="resetForm()">Limpiar</button>
        </div>
      </form>
    </div>

    <!-- LIST -->
    <div class="card">
      <h2 class="section-title">EVENTOS <span>CARGADOS</span></h2>
      <p class="section-sub" id="eventsCount">Cargando...</p>
      <div class="events-list" id="eventsList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc,
  doc, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCbb85E5IgGiQEArNxW4AEdPZa6ljwh6Mk",
  authDomain: "taxiblue-87289.firebaseapp.com",
  projectId: "taxiblue-87289",
  storageBucket: "taxiblue-87289.firebasestorage.app",
  messagingSenderId: "886873440517",
  appId: "1:886873440517:web:40e806c6444fd7d2cff76c",
  measurementId: "G-M04PSGFYDM"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = "eventos";

const ADMIN_PASS = '666666';
const MAX_FLYER_KB = 800;

let flyerBase64 = null;
let events = [];
let unsubscribe = null;

/* LOGIN */
function tryLogin(){
  const val = document.getElementById('passInput').value.trim();
  if(val === ADMIN_PASS){
    sessionStorage.setItem('tbAuth','1');
    showPanel();
  } else {
    const err = document.getElementById('loginError');
    err.classList.add('show');
    setTimeout(()=>err.classList.remove('show'),2500);
    document.getElementById('passInput').value = '';
  }
}
document.getElementById('passInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') tryLogin();
});
document.getElementById('passInput').addEventListener('input', () => {
  document.getElementById('loginError').classList.remove('show');
});

function showPanel(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('panel').classList.add('active');
  subscribeEvents();
}
function logout(){
  sessionStorage.removeItem('tbAuth');
  if(unsubscribe) unsubscribe();
  location.reload();
}

/* FIRESTORE: escucha en tiempo real */
function subscribeEvents(){
  const q = query(collection(db, COL), orderBy("fecha", "asc"));
  unsubscribe = onSnapshot(q, (snap) => {
    events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderEvents();
  }, (err) => {
    console.error(err);
    toast('❌ Error al leer Firestore. Revisá las reglas.', 'error');
  });
}

/* FORM */
function handleFlyer(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!/image\/(jpeg|jpg|png)/.test(file.type)){
    toast('Solo se permiten JPG o PNG','error'); return;
  }
  if(file.size > MAX_FLYER_KB * 1024){
    toast(`La imagen supera ${MAX_FLYER_KB} KB. Comprimila antes.`,'error'); return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    flyerBase64 = ev.target.result;
    document.getElementById('flyerImg').src = flyerBase64;
    document.getElementById('flyerPreview').classList.add('show');
  };
  reader.readAsDataURL(file);
}
function removeFlyer(){
  flyerBase64 = null;
  document.getElementById('flyerInput').value = '';
  document.getElementById('flyerPreview').classList.remove('show');
  document.getElementById('flyerImg').src = '';
}

function resetForm(){
  document.getElementById('editId').value = '';
  document.getElementById('fecha').value = '';
  document.getElementById('hora').value = '';
  document.getElementById('titulo').value = '';
  document.getElementById('lugar').value = '';
  document.getElementById('descripcion').value = '';
  removeFlyer();
  document.getElementById('formTitle').innerHTML = 'NUEVO <span>EVENTO</span>';
}

async function saveEvent(e){
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const data = {
    fecha: document.getElementById('fecha').value,
    hora: document.getElementById('hora').value.trim(),
    titulo: document.getElementById('titulo').value.trim(),
    lugar: document.getElementById('lugar').value.trim(),
    descripcion: document.getElementById('descripcion').value.trim(),
    flyer: flyerBase64 || null
  };
  if(!data.fecha || !data.titulo || !data.lugar){
    toast('Completá los campos obligatorios','error'); return;
  }

  try {
    if(id){
      await updateDoc(doc(db, COL, id), data);
      toast('✅ Evento actualizado','success');
    } else {
      await addDoc(collection(db, COL), data);
      toast('✅ Evento agregado','success');
    }
    resetForm();
  } catch(err){
    console.error(err);
    toast('❌ Error al guardar en Firestore','error');
  }
}

function editEvent(id){
  const ev = events.find(x=>x.id===id); if(!ev) return;
  document.getElementById('editId').value = ev.id;
  document.getElementById('fecha').value = ev.fecha;
  document.getElementById('hora').value = ev.hora || '';
  document.getElementById('titulo').value = ev.titulo;
  document.getElementById('lugar').value = ev.lugar;
  document.getElementById('descripcion').value = ev.descripcion || '';
  if(ev.flyer){
    flyerBase64 = ev.flyer;
    document.getElementById('flyerImg').src = ev.flyer;
    document.getElementById('flyerPreview').classList.add('show');
  } else {
    removeFlyer();
  }
  document.getElementById('formTitle').innerHTML = 'EDITAR <span>EVENTO</span>';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteEvent(id){
  if(!confirm('¿Eliminar este evento?')) return;
  try {
    await deleteDoc(doc(db, COL, id));
    toast('🗑️ Evento eliminado','success');
  } catch(err){
    console.error(err);
    toast('❌ Error al eliminar','error');
  }
}

/* RENDER */
function renderEvents(){
  const list = document.getElementById('eventsList');
  const count = document.getElementById('eventsCount');
  count.textContent = `${events.length} evento${events.length!==1?'s':''} programado${events.length!==1?'s':''}`;
  if(!events.length){
    list.innerHTML = '<div class="empty-state">Todavía no hay eventos cargados.<br>Agregá el primero desde el formulario.</div>';
    return;
  }
  list.innerHTML = events.map(ev=>{
    const d = new Date(ev.fecha + 'T00:00:00');
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = d.toLocaleDateString('es-AR',{month:'short'}).replace('.','').toUpperCase();
    const yy = d.getFullYear();
    return `
      <div class="event-item">
        ${ev.flyer ? `<img class="event-thumb" src="${ev.flyer}" alt="">` : ''}
        <div class="info">
          <span class="date">${dd} ${mm} ${yy}${ev.hora?' · '+ev.hora:''}</span>
          <div class="title">${escapeHtml(ev.titulo)}</div>
          <div class="place">${escapeHtml(ev.lugar)}</div>
        </div>
        <div class="actions">
          <button class="edit" title="Editar" onclick="editEvent('${ev.id}')">✎</button>
          <button class="del" title="Eliminar" onclick="deleteEvent('${ev.id}')">✕</button>
        </div>
      </div>`;
  }).join('');
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* TOAST */
let toastTimer;
function toast(msg, type=''){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 3000);
}

/* Exponer funciones globales */
window.tryLogin = tryLogin;
window.logout = logout;
window.handleFlyer = handleFlyer;
window.removeFlyer = removeFlyer;
window.resetForm = resetForm;
window.saveEvent = saveEvent;
window.editEvent = editEvent;
window.deleteEvent = deleteEvent;

/* INIT */
if(sessionStorage.getItem('tbAuth') === '1'){
  showPanel();
}
</script>
</body>
</html>
